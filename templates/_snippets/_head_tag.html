{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}AMW ShowCases{% endblock %}</title>
<meta name="description" content="{% block meta_description %}Professional portfolio showcasing skills, projects, and technical expertise{% endblock %}">

<!-- Favicon -->
<link rel="icon" type="image/png" href="{% static 'images/Avatar_Python_Dev_512.png' %}">
<link rel="shortcut icon" href="{% static 'images/Avatar_Python_Dev_512.png' %}">

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Bootstrap Icons -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">

<!-- Highlight.js -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">

<!-- Devicon (skill icons) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

<!-- Custom CSS -->
<link href="{% static 'css/variables.css' %}" rel="stylesheet">
<link href="{% static 'css/custom.css' %}" rel="stylesheet">
{% block extra_css %}{% endblock %}
