{% extends "base.html" %}

{% block title %}Delete Post - AMW Portfolio{% endblock %}

{% block content %}
<div class="container py-4">
    <h1 class="mb-4">Delete Post</h1>

    <p>Are you sure you want to delete "{{ object.title }}"?</p>

    <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger">Confirm Delete</button>
            <a href="{% url 'blog:detail' object.slug %}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
